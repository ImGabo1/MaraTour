# Alternativa a Vercel si prefieres Netlify (plan gratuito, sin tarjeta).
[build]
  command = "npm run build -w frontend"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

# /api se reenvía al backend de Render: mismo origen, sin CORS.
[[redirects]]
  from = "/api/*"
  to = "https://maratour-api.onrender.com/api/:splat"
  status = 200
  force = true

# La app usa rutas con #, pero esto evita 404 si algún día se usan rutas normales.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
